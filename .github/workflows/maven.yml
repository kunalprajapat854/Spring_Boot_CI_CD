
name: Java CI with Maven

on:
  push:
    branches: 
     - main 
 

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn clean install

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    -  name: Set up Docker Buildx
       uses: docker/setup-buildx-action@v1

    - name: Login Into docker hub
      uses: docker/login-action@v1
      with:
           username: ${{secrets.DOCKER_USER_NAME}}
           password: ${{secrets.DOCKER_USER_PASSWORD}}
    - name: Build and Push into docker image
      uses: docker/build-push-action@v2
      with:
         context: .
         push : true
         tags: kunalprajapat854/Spring_Boot_CI_CD:${{ github.sha }}

    - name : Deploy Into EC2-Instance
      uses: applyboy/ssh-action@master
      env:
        host: ${{secrets.EC2_HOST}}
        username: ${{secrets.EC2_HOST_USERNAME}}
        key: ${{secrets.EC2_HOST_KEY}}
        script: |
          docker stop Spring_Boot_CI_CD || true
          docker rm Spring_Boot_CI_CD   || true
          docker pull ${{secrets.DOCKER_USER_NAME}} /Spring_Boot_CI_CD:${{github.sha}}
          docker run -d --name Spring_Boot_CI_CD -p 8080:9090 ${{secrets.DOCKER_USER_NAME}}         
           
           script :  |
    
           if ! command -v docker &> /dev/null; then
           sudo apt-get update
           sudo apt-get install -y docker.io
           fi

           sudo usermod -a -G docker $USER
           sudo chmod 777 /var/run/docker.sock

           docker stop Spring_Boot_CI_CD || true
           docker rm Spring_Boot_CI_CD || true

             docker pull ${{ secrets.DOCKER_USER_NAME }}/Spring_Boot_CI_CD:${{ github.sha }}
            docker run -d --name Spring_Boot_CI_CD -p 8080:9090 ${{ secrets.DOCKER_USER_NAME }}/Spring_Boot_CI_CD:${{ github.sha }}
